version: '3.8'

services:
  # Frontend Service - Next.js
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: financial_tracker_frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8080/api/v1
      - NEXT_PUBLIC_WS_URL=ws://localhost:8080/ws
      - NEXT_PUBLIC_APP_NAME=AI Financial Tracker
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - financial_tracker_network
    restart: unless-stopped
    volumes:
      - frontend_uploads:/app/uploads

  # Backend Service - Go API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: financial_tracker_backend
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=development
      - PORT=8080
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=financial_tracker
      - DB_USER=app_user
      - DB_PASSWORD=secure_app_password_2024
      - DB_SSL_MODE=disable
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=secure_redis_password_2024
      - REDIS_DB=0
      - JWT_SECRET=your_super_secret_jwt_key_change_in_production
      - JWT_REFRESH_SECRET=your_super_secret_refresh_key_change_in_production
      - FILE_UPLOAD_PATH=/app/uploads
      - MAX_FILE_SIZE=10485760  # 10MB
      - ALLOWED_FILE_TYPES=jpg,jpeg,png,pdf
      - OCR_API_KEY=your_ocr_api_key
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_USERNAME=your_email@gmail.com
      - SMTP_PASSWORD=your_app_password
      - LOG_LEVEL=debug
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - financial_tracker_network
    restart: unless-stopped
    volumes:
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Database Service - PostgreSQL
  postgres:
    build:
      context: ./database
      dockerfile: Dockerfile
    container_name: financial_tracker_postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=financial_tracker
      - POSTGRES_USER=app_user
      - POSTGRES_PASSWORD=secure_app_password_2024
      - POSTGRES_ROOT_PASSWORD=secure_root_password_2024
    networks:
      - financial_tracker_network
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d financial_tracker"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Cache Service - Redis
  redis:
    build:
      context: ./redis
      dockerfile: Dockerfile
    container_name: financial_tracker_redis
    ports:
      - "6379:6379"
    environment:
      - REDIS_PASSWORD=secure_redis_password_2024
    networks:
      - financial_tracker_network
    restart: unless-stopped
    volumes:
      - redis_data:/data
      - redis_logs:/var/log/redis
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Development tools - PgAdmin
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: financial_tracker_pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@financialtracker.dev
      - PGADMIN_DEFAULT_PASSWORD=admin123
      - PGADMIN_LISTEN_PORT=5050
    ports:
      - "5050:5050"
    networks:
      - financial_tracker_network
    depends_on:
      - postgres

  # Development tools - Redis Commander
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: financial_tracker_redis_commander
    environment:
      - REDIS_HOSTS=local:redis:6379:0:secure_redis_password_2024
    ports:
      - "8081:8081"
    networks:
      - financial_tracker_network
    depends_on:
      - redis

# Named volumes for data persistence
volumes:
  postgres_data:
    driver: local
  postgres_backups:
    driver: local
  redis_data:
    driver: local
  redis_logs:
    driver: local
  backend_uploads:
    driver: local
  backend_logs:
    driver: local
  frontend_uploads:
    driver: local

# Custom network for service communication
networks:
  financial_tracker_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16